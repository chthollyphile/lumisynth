# 桌面版（Electron）发布：推 v* tag 时在三个平台各打一份安装包，汇总成一个 draft release，
# 检查无误后在 GitHub 上手动发布（发布之后，已安装的桌面版才会检查到这个新版本）。
# 手动触发（workflow_dispatch）只打包并上传为 artifact，不建 release，用来试打包。
#
# 发布一个版本：
#   1. 把 package.json 的 version 改成新版本号（A.B.C）并提交
#   2. git tag v<版本号> && git push origin v<版本号>
name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的版本 ${VERSION} 不一致"
            exit 1
          fi

      - name: Build web app
        run: npm run build

      - name: Package Electron app
        env:
          # 安装包不签名（与 folia 一致）：macOS 首次打开要手动放行，见 docs/DESKTOP.md。
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          DESKTOP_DOC_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/DESKTOP.md
        run: |
          sed -e "s|{{VERSION}}|${VERSION#v}|g" -e "s|{{DESKTOP_DOC_URL}}|${DESKTOP_DOC_URL}|g" \
            .github/desktop-release-notes.md > release-notes.md

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" \
              --title "lumisynth ${TAG}" --notes-file release-notes.md --target "${GITHUB_SHA}" --draft
          fi
