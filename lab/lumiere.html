<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumiere Lab</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #111; color: #ddd; font: 13px/1.5 system-ui, sans-serif; display: flex; gap: 16px; padding: 16px; box-sizing: border-box; }
      #stage { flex: 1; min-width: 0; }
      #mount { width: 100%; aspect-ratio: 16 / 9; background: #000; }
      #mount.checker { background: repeating-conic-gradient(#555 0 25%, #333 0 50%) 0 0 / 24px 24px; }
      #mount canvas { width: 100%; height: 100%; display: block; }
      #panel { width: 280px; flex: none; display: flex; flex-direction: column; gap: 8px; }
      label { display: flex; flex-direction: column; gap: 2px; }
      label.row { flex-direction: row; align-items: center; gap: 6px; }
      input[type=range] { width: 100%; }
      button, select { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; }
      #time { font-variant-numeric: tabular-nums; }
      #perf { white-space: pre-wrap; color: #9c9; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="mount"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <button id="play">播放</button>
        <input id="scrub" type="range" min="0" max="20" step="0.01" value="6" style="flex:1" />
        <span id="time">0.00</span>
      </div>
    </div>
    <div id="panel"></div>
    <script type="module" src="/src/packs/lumiere/lab/main.ts"></script>
  </body>
</html>
